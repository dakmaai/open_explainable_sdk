[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dakma-sdk"
version = "0.1.0"
description = "Explainability SDK for ML lifecycle tracking and auditable decisions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Dakma SDK Team" }
]
dependencies = [
  "numpy>=1.22",
  "psutil>=5.9",
]

[project.optional-dependencies]
ml = [
  "pandas>=1.5",
  "scikit-learn>=1.3",
  "xgboost>=1.7",
  "shap>=0.44",
]
dl = [
  "torch>=2.0",
  "captum>=0.6",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["dakma", "dakma_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
